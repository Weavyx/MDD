<mat-card appearance="filled" class="topic-card">
  <mat-card-header>
    <mat-card-title>
      <h2 class="topic-card-title">{{ topic().name }}</h2>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p class="topic-card-description">{{ topic().description }}</p>
  </mat-card-content>
  <mat-card-actions class="topic-card-actions">
    <ng-content />
  </mat-card-actions>
</mat-card>
