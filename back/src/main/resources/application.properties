spring.application.name=mdd-api

# --- Profil actif ---
spring.profiles.active=local

# --- Datasource MySQL ---
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mdd}
spring.datasource.username=${MYSQL_USER:mdd_user}
# Le mot de passe n'est volontairement PAS défini ici : il vient du profil "local"
# (application-local.properties, gitignored) pour ne jamais committer de secret,
# même un secret de dev.

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT (config applicative, la clé de signature sera ajoutée à l'étape sécurité) ---
mdd.jwt.issuer=mdd-api
mdd.jwt.expiration-minutes=1440

# --- CORS ---
mdd.cors.allowed-origins=${MDD_CORS_ALLOWED_ORIGINS:http://localhost:4200}