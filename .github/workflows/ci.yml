name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-et-tests:
    name: Build et tests (back puis front)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Installer Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: back/pom.xml

      - name: Back — compilation, tests unitaires et d'intégration, couverture JaCoCo, dépendances pour Sonar
        working-directory: back
        run: ./mvnw -B clean verify dependency:copy-dependencies

      - name: Installer Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Front — installation des dépendances
        working-directory: front
        run: npm ci --ignore-scripts

      - name: Front — lint
        working-directory: front
        run: npm run lint

      - name: Front — formatage (Prettier)
        working-directory: front
        run: npm run format:check

      - name: Front — tests unitaires et couverture
        working-directory: front
        run: npm test -- --watch=false --coverage --coverage-reporters=lcovonly

      - name: Front — build de production
        working-directory: front
        run: npm run build

      - name: Vérifier la présence des fichiers lus par Sonar
        run: ls -ld back/target/classes back/target/test-classes back/target/dependency back/target/site/jacoco/jacoco.xml front/coverage/front/lcov.info

      - name: Front — chemins du rapport de couverture relatifs à la racine du dépôt
        run: sed -i 's#^SF:src/#SF:front/src/#' front/coverage/front/lcov.info

      - name: Analyse SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
