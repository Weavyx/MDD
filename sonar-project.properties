# Analyse SonarQube Cloud par la CI GitHub Actions (lot L3).
# Projet unique à la racine du dépôt (back et front).

sonar.organization=weavyx
sonar.projectKey=Weavyx_MDD
sonar.sourceEncoding=UTF-8

# Périmètre : tout fichier suivi par git, sauf ce qui est généré par un outil.
# Ne pas ajouter .github à sonar.sources : il est déjà indexé depuis la racine.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=back/src/test/**,front/src/**/*.spec.ts,front/src/**/testing/**,front/src/**/testing.ts,front/cypress/**
sonar.exclusions=back/mvnw,back/mvnw.cmd,back/.mvn/**,**/package-lock.json
sonar.text.inclusions.activate=true

# Java : bytecode et bibliothèques produits par la CI (clean verify dependency:copy-dependencies).
sonar.java.source=21
sonar.java.binaries=back/target/classes
sonar.java.test.binaries=back/target/test-classes
sonar.java.libraries=back/target/dependency/*.jar
sonar.java.test.libraries=back/target/dependency/*.jar

# Couverture : JaCoCo pour le back, LCOV (chemins préfixés par front/ dans la CI) pour le front.
sonar.coverage.jacoco.xmlReportPaths=back/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=front/coverage/front/lcov.info

# TypeScript : tsconfig utilisés pour l'analyse.
sonar.typescript.tsconfigPaths=front/tsconfig.app.json,front/tsconfig.spec.json,front/cypress/tsconfig.json
